<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala do futuro v2</title>
    
    <!-- CSS da página  -->
    <style>
        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        
        #timer {
            background: #ff3b30;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            position: fixed;
            top: 10px;
            right: 10px;
            font-weight: bold;
            z-index: 100;
        }

        .card {
            background: #1a1a1a;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #333;
        }

        img {
            max-width: 200px;
            margin-top: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Simulação do tempo ou bomba invisivel -->
    <div id="timer">10</div>

    <div class="card">
        <h1>Sala do futuro V2</h1>
        <p>Login professor/simulado!</p>
        
        <!-- Imagem e imagem... -->
        <img src="logosp.png" alt="Logo do governo de sp">
    </div>

    <!-- Batata do temporizador -->
    <script>
        let segundos = 10;
        
        const intervalo = setInterval(() => {
            segundos--;
            const timerElement = document.getElementById('timer');
            if (timerElement) {
                timerElement.innerText = segundos;
            }
            
            if (segundos <= 0) {
                clearInterval(intervalo);
                window.location.href = "login/Prof";
            }
        }, 1000);
    </script>

</body>
</html>
